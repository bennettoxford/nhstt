# NHS Talking Therapies tidy annual data configuration
# Tidy options: clean_column_names, rename, recode, na_values, filter, as_numeric, separate, mutate, pivot_longer, clean_column_values, select
# Rename format: new_name: old_name (use "YYYY-YY"/"YYYY-MM" keys for period-specific renames)
datasets:
  measures_annual:
    clean_column_names: true

    # Harmonise labels that changed wording but not meaning, using the latest label
    recode:
      variable_a:
        "First treatment": "Accessing services"
        "First to Second treatment": "First to Second Treatment"
        "Other mental health care cluster": "Other Mental Health Care Cluster"
        "Other recorded problems": "Other Recorded Problems"
        "Received both high and low intensity therapy": "Received both LI and HI therapies"
        "Received only high intensity therapy": "Received only HI therapy"
        "Received only low intensity therapy": "Received only LI therapy"
        "Short Message Service (SMS)": "Short Message Service (SMS) - Text Messaging"
        "Talk type for a person unable to speak": "Talk type for a Person unable to speak"
        "Telemedicine": "Telemedicine web camera"
      variable_b:
        "Any other Asian background": "Any Other Asian Background"
        "Any other Black background": "Any Other Black Background"
        "Any other Mixed background": "Any Other Mixed Background"
        "Any other White background": "Any Other White Background"
        "Body dysmorphic disorder": "Body Dysmorphic Disorder"
        "Generalised anxiety disorder": "Generalized anxiety disorder"
        "Hypochondriacal disorders": "Hypochondriacal disorder"
        "Mean wait": "Mean Wait"

    filter:
      org_type:
        - England
        - Commissioning Region
        - STP
        - CCG
        - ICB
        - SubICB
        - Provider
      variable_type:
        - Total
        - Age Group
        - Consultation Medium
        - Disability Type
        - Ethnic Group
        - BME Group
        - Indices of Deprivation Decile
        - Long Term Condition Status
        - Mental Health Care Cluster
        - Gender
        - Sexual Orientation Type
        - Problem Descriptor
        - Presenting Complaint
        - Stepped Care Pathway
        - Religion
        - Waiting Time
    
    pivot_longer:
      id_cols:
        - org_type
        - org_code
        - org_name
        - variable_type
        - variable_a
        - variable_b

      measure_cols:
        - count_referrals_received
        - count_finished_course_treatment
        - count_at_caseness
        - count_not_at_caseness
        - count_improvement
        - percentage_improvement
        - count_deterioration
        - percentage_deterioration
        - count_no_reliable_change
        - percentage_no_reliable_change
        - count_reliable_recovery
        - percentage_reliable_recovery
        - count_recovery
        - percentage_recovery

      sep: "^(count|mean|median|percentage|sum)_(.+)$"
      names_to:
        - measure_statistic
        - measure_name

    as_numeric:
      - value

    clean_column_values:
      - measure_name
      - measure_statistic

    select:
      - reporting_period
      - start_date
      - end_date
      - org_type
      - org_code
      - org_name
      - variable_type
      - variable_a
      - variable_b
      - measure_name
      - measure_statistic
      - value

  proms_annual:
    clean_column_names: true

    rename:
      org_type: organisation_type
      org_code: organisation_code
      org_name: organisation_name
      variable_a: diagnosis
      variable_b: therapy_type
      mean_start_phq: start_phq_mean
      sd_start_phq: start_phq_std_dev
      mean_start_gad: start_gad_mean
      sd_start_gad: start_gad_std_dev
      mean_start_wsas: start_wsas_mean
      sd_start_wsas: start_wsas_std_dev
      mean_end_phq: end_phq_mean
      sd_end_phq: end_phq_std_dev
      mean_end_gad: end_gad_mean
      sd_end_gad: end_gad_std_dev
      mean_end_wsas: end_wsas_mean
      sd_end_wsas: end_wsas_std_dev
      effect_size_phq: effect_phq
      effect_size_gad: effect_gad
      effect_size_wsas: effect_wsas

    # Harmonise labels that changed wording but not meaning, using the latest label
    recode:
      variable_a:
        "Body Dysmorphic Disorder": "Body Dysmorphic disorder"

    mutate:
      variable_type:
        value: "PROMs"

    pivot_longer:
      id_cols:
        - org_type
        - org_code
        - org_name
        - variable_a
        - variable_b

      measure_cols:
        - "count_total_finishing_course_treatment"
        - "count_courses_of_therapy"
        - "count_not_caseness"
        - "count_ther_recovery"
        - "percentage_ther_recovery"
        - "count_ther_rel_recovery"
        - "percentage_ther_rel_recovery"
        - "count_ther_improvement"
        - "percentage_ther_improvement"
        - "count_ther_deterioration"
        - "percentage_ther_deterioration"
        - "count_ther_no_change"
        - "percentage_ther_no_change"
        - "mean_start_phq"
        - "sd_start_phq"
        - "mean_start_gad"
        - "sd_start_gad"
        - "mean_start_wsas"
        - "sd_start_wsas"
        - "mean_end_phq"
        - "sd_end_phq"
        - "mean_end_gad"
        - "sd_end_gad"
        - "mean_end_wsas"
        - "sd_end_wsas"
        - "effect_size_phq"
        - "effect_size_gad"
        - "effect_size_wsas"           

      sep: "^(count|mean|sd|percentage|effect_size)_(.+)$"
      names_to:
        - measure_statistic
        - measure_name
      measure_time_sep: "^(start|end)_(.+)$"

    as_numeric:
      - value

    clean_column_values:
      - measure_name
      - measure_statistic

    select:
      - reporting_period
      - start_date
      - end_date
      - org_type
      - org_code
      - org_name
      - variable_type
      - variable_a
      - variable_b
      - measure_name
      - measure_statistic
      - measure_time
      - value
  
  therapy_position_annual:
    clean_column_names: true

    rename:
      variable_a: therapy_type
      count_position_1: count_1therapy
      count_position_2: count_2therapies
      count_position_3: count_3therapies
      count_position_4: count_4therapies

    # Harmonise labels that changed wording but not meaning, using the latest label
    recode:
      variable_a:
        "20 Guided_Self_Help_Book": "20 Guided Self Help"
        "42 Couples_Therapy": "42 Couples Therapy for Depression"
        "50 Cognitive_Behavioural_Therapy": "50 Cognitive Behaviour Therapy (CBT)"
        "51 Interpersonal_Psychotherapy": "51 Interpersonal Psycho therapy (IPT)"

    pivot_longer:
      id_cols:
        - variable_a
      
      measure_cols:
        - count_position_1
        - count_position_2
        - count_position_3
        - count_position_4

      sep: "^(count)_(.+)$"
      names_to:
      - measure_statistic
      - measure_name
    

    mutate:
      org_type:
        value: "England"
      org_code:
        value: "All"
      org_name: 
        value: "All"
      variable_type:
        value: "therapy_type"
      variable_b:
        value: "NA"

    clean_column_values:
      - variable_a

    select:
      - reporting_period
      - start_date
      - end_date
      - org_type
      - org_code
      - org_name
      - variable_type
      - variable_a
      - variable_b
      - measure_name
      - measure_statistic
      - value
