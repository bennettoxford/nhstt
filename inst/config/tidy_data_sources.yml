# Each dataset has one entry per published release, newest first.
# The first entry is the default returned by get_*(). Older entries can be
# pinned with version = "x.y.z" for reproducibility.
#
# Every entry has an explicit url pointing at the GitHub Release parquet
# asset. Copy the url from the release page (or from the previous entry,
# updating the version). `just release <dataset> <version>` creates the tag
# {dataset-with-dashes}-v{version}, so the url for a new release is:
# https://github.com/bennettoxford/nhstt/releases/download/{tag}/{dataset}.parquet
#
# This file is the single source of truth for published dataset versions.
#
# To publish updated data for a dataset:
#   1. Add a new version entry (version + url) at the top of the dataset's
#      list (keep older entries below — the first entry is the default)
#   2. Run `just build-data` to write parquets to data-raw/
#   3. Run `just release <dataset> <version>` after merging to main
#   4. Check the url in this file matches the asset url on the release page
datasets:
  measures_annual:
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/nhstt/releases/download/key-measures-annual-v0.2.0/key_measures_annual.parquet"
  proms_annual:
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/nhstt/releases/download/proms-annual-v0.2.0/proms_annual.parquet"
  therapy_position_annual:
