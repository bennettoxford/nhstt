  metadata_measures_monthly:
    versions:
      - version: "0.2.0"
        url: "https://github.com/bennettoxford/nhstt/releases/download/metadata-measures-monthly-v0.2.0/metadata_measures_monthly.parquet"
      - version: "0.1.0"
        url: "https://github.com/bennettoxford/nhstt/releases/download/metadata-measures-monthly-v0.1.0/metadata_measures_monthly.parquet"
